name: Feature Request
description: 提出一个功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: input
    id: module
    attributes:
      label: 所属模块
      placeholder: "review / report / knowledge / credentials / topology / web"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: dropdown
    id: phase
    attributes:
      label: 建议阶段
      options:
        - Phase 0 基线
        - Phase 1 多用户底座
        - Phase 2 低风险增强
        - Phase 3 审核+模板
        - Phase 4 执行器+Finding 编排
        - Phase 5 报告
        - Phase 6 知识库
        - Phase 7 凭据+拓扑
        - Phase 8 加固
        - 未定
